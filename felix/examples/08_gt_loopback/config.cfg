[connectivity]
shell=compute
nk=gt_prbs_gen:4:gt_prbs_gen_0.gt_prbs_gen_1.gt_prbs_gen_2.gt_prbs_gen_3
nk=gt_prbs_check:4:gt_prbs_check_0.gt_prbs_check_1.gt_prbs_check_2.gt_prbs_check_3
stream_connect=gt_prbs_gen_0.axis_out:gt_0.tx
stream_connect=gt_0.rx:gt_prbs_check_0.axis_in
stream_connect=gt_prbs_gen_1.axis_out:gt_1.tx
stream_connect=gt_1.rx:gt_prbs_check_1.axis_in
stream_connect=gt_prbs_gen_2.axis_out:gt_2.tx
stream_connect=gt_2.rx:gt_prbs_check_2.axis_in
stream_connect=gt_prbs_gen_3.axis_out:gt_3.tx
stream_connect=gt_3.rx:gt_prbs_check_3.axis_in

[clock]
krnl=gt_prbs_gen_0
freqhz=250000000

[clock]
krnl=gt_prbs_check_0
freqhz=250000000

[clock]
krnl=gt_prbs_gen_1
freqhz=250000000

[clock]
krnl=gt_prbs_check_1
freqhz=250000000

[clock]
krnl=gt_prbs_gen_2
freqhz=250000000

[clock]
krnl=gt_prbs_check_2
freqhz=250000000

[clock]
krnl=gt_prbs_gen_3
freqhz=250000000

[clock]
krnl=gt_prbs_check_3
freqhz=250000000
